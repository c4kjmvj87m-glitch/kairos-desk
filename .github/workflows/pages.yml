name: App publiceren

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      actions: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/upload-pages-artifact@v5
        with:
          path: .
      - name: Wachten tot GitHub het artifact ziet
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          for i in $(seq 1 36); do
            n=$(gh api "repos/${{ github.repository }}/actions/runs/${{ github.run_id }}/artifacts?name=github-pages" --jq '.total_count' 2>/dev/null || echo 0)
            if [ "${n:-0}" -ge 1 ]; then echo "Artifact zichtbaar na $((i * 5)) s"; sleep 5; exit 0; fi
            sleep 5
          done
          echo "Artifact na 3 minuten nog niet zichtbaar; toch proberen"
      - id: deployment
        uses: actions/deploy-pages@v5
