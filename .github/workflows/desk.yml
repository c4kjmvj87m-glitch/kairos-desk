name: KAIROS desk-run

on:
  schedule:
    - cron: "15 7,13,22 * * 1-5"
      timezone: "Europe/Brussels"
  workflow_dispatch:

concurrency:
  group: kairos-desk-run
  cancel-in-progress: false

jobs:
  desk:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v5
      - name: Desk-run
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          KAIROS_CLAUDE_MODEL: ${{ vars.KAIROS_CLAUDE_MODEL }}
          KAIROS_GEMINI_MODEL: ${{ vars.KAIROS_GEMINI_MODEL }}
          KAIROS_GROQ_MODEL: ${{ vars.KAIROS_GROQ_MODEL }}
          KAIROS_SEARCHES: ${{ vars.KAIROS_SEARCHES }}
        run: python3 engine/kairos.py
      - name: Desk opslaan
        run: |
          git config user.name "kairos-desk-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/desk.json data/runs.json data/state.json
          if git diff --cached --quiet; then echo "Geen wijzigingen"; exit 0; fi
          git commit -q -m "Desk-run $(TZ=Europe/Brussels date '+%Y-%m-%d %H:%M')"
          for i in 1 2 3; do git pull --rebase -q && git push -q && exit 0; sleep 5; done
          exit 1

  deploy:
    needs: desk
    runs-on: ubuntu-latest
    permissions:
      contents: read
      actions: read
      pages: write
      id-token: write
    concurrency:
      group: pages
      cancel-in-progress: false
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v5
        with:
          ref: main
      - uses: actions/upload-pages-artifact@v5
        with:
          path: .
      - name: Wachten tot GitHub het artifact ziet
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          for i in $(seq 1 36); do
            n=$(gh api "repos/${{ github.repository }}/actions/runs/${{ github.run_id }}/artifacts?name=github-pages" --jq '.total_count' 2>/dev/null || echo 0)
            if [ "${n:-0}" -ge 1 ]; then echo "Artifact zichtbaar na $((i * 5)) s"; sleep 5; exit 0; fi
            sleep 5
          done
          echo "Artifact na 3 minuten nog niet zichtbaar; toch proberen"
      - id: deployment
        uses: actions/deploy-pages@v5
