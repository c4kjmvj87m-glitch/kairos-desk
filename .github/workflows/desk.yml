name: KAIROS desk-run

on:
  schedule:
    - cron: "46 7,13,22 * * 1-5"
      timezone: "Europe/Brussels"
  workflow_dispatch:

concurrency:
  group: kairos-desk-run
  cancel-in-progress: false

jobs:
  desk:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v5
      - name: Desk-run
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          KAIROS_CLAUDE_MODEL: ${{ vars.KAIROS_CLAUDE_MODEL }}
          KAIROS_GEMINI_MODEL: ${{ vars.KAIROS_GEMINI_MODEL }}
          KAIROS_GROQ_MODEL: ${{ vars.KAIROS_GROQ_MODEL }}
        run: python3 engine/desk.py
      - name: Desk opslaan
        run: |
          git config user.name "kairos-desk-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/desk.json data/runs.json
          if git diff --cached --quiet; then echo "Geen wijzigingen"; exit 0; fi
          git commit -q -m "Desk-run $(TZ=Europe/Brussels date '+%Y-%m-%d %H:%M')"
          for i in 1 2 3; do git pull --rebase -q && git push -q && exit 0; sleep 5; done
          exit 1

  deploy:
    needs: desk
    runs-on: ubuntu-latest
    permissions:
      contents: read
      actions: read
      pages: write
      id-token: write
    concurrency:
      group: pages
      cancel-in-progress: false
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v5
        with:
          ref: main
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v5
        with:
          path: .
      - id: deployment
        uses: actions/deploy-pages@v5
